name: release-publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Release-manifest package to build and publish
        required: true
        type: choice
        options:
          - workstate-protocol
          - mcp-workstate-handoff
          - mcp-workstate-orchestrator
          - workstate-bootstrap
          - workstate-codex-bridge
          - workstate-system
      dry_run:
        description: Build and validate only; skip the Trusted Publishing upload job
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: Compute release plan
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.selected-package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Validate release manifest
        run: python scripts/release_manifest.py validate

      - name: Compute release plan JSON
        run: scripts/release.sh plan --json > release-plan.json

      - name: Validate selected package plan state
        id: selected-package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("release-plan.json").read_text(encoding="utf-8"))
          package_name = os.environ["PACKAGE"]
          package = next((entry for entry in plan["packages"] if entry["name"] == package_name), None)
          if package is None:
              raise SystemExit(f"{package_name} is not present in release-plan.json")
          # Both states mean "this version is not on PyPI and is safe to
          # publish". `pending_upload` is the tag-after-publish flow; the
          # tag-driven `release-public` flow force-syncs the package tag FIRST,
          # which lands the package in `remote_tag_without_pypi` — the natural
          # state when a tag precedes CI Trusted-Publishing. Accept both;
          # `released` (already on PyPI) and everything else still fail-closed.
          PUBLISHABLE_STATES = {"pending_upload", "remote_tag_without_pypi"}
          if package["state"] not in PUBLISHABLE_STATES:
              raise SystemExit(
                  f"{package_name} is in state {package['state']}; expected one of "
                  f"{sorted(PUBLISHABLE_STATES)} (version absent from PyPI) before CI publish"
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"version={package['version']}\n")
          PY

      - name: Upload release plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ inputs.package }}
          path: release-plan.json

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build selected package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          rm -rf dist
          python -m build --outdir dist "packages/${PACKAGE}"
          python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ inputs.package }}-${{ needs.plan.outputs.package_version }}
          path: dist/

  publish:
    name: Publish via Trusted Publishing
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    needs: [plan, build]
    environment:
      name: pypi
      url: https://pypi.org/project/${{ inputs.package }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist-${{ inputs.package }}-${{ needs.plan.outputs.package_version }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
