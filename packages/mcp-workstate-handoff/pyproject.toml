[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-workstate-handoff"
version = "0.12.8"
description = "Portable MCP server for agent handoff state and review tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp",
    "pydantic>=2.6.0,<3.0.0",
    "tiktoken>=0.9.0",
    "workstate-protocol>=0.2.6,<0.3.0",
]

[project.scripts]
mcp-workstate-handoff = "workstate_handoff_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/darce/workstate"
Source = "https://github.com/darce/workstate/tree/main/packages/mcp-workstate-handoff"
Changelog = "https://github.com/darce/workstate/blob/main/packages/mcp-workstate-handoff/CHANGELOG.md"
Issues = "https://github.com/darce/workstate/issues"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-timeout>=2.3.0", "jsonschema>=4.0.0"]
dev = [
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.uv.sources]
# Dev-only monorepo override for local iteration; setuptools wheel metadata
# still comes from [project.dependencies] above.
workstate-protocol = { path = "../workstate-protocol", editable = true }

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["workstate_handoff_mcp_launcher"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["build", "src/*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/workstate_handoff_mcp/_shared.py" = ["F401"]
"src/workstate_handoff_mcp/api.py" = ["F401"]
"src/workstate_handoff_mcp/cli.py" = ["F401"]
"tests/**/*.py" = ["E402", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["build/"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["workstate_protocol", "workstate_protocol.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
norecursedirs = [".pytest_cache", "build", "src/*.egg-info"]

[tool.hoisted]
repository = "darce/workstate"
install_url = "git+https://github.com/darce/workstate.git@mcp-workstate-handoff-v{version}#subdirectory=packages/mcp-workstate-handoff"
changelog = "CHANGELOG.md"
