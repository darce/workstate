version: 1

cold_start:
  shared_steps:
    - id: make-context
      description: "run make context at session start"
      phrase: "make context"
      references:
        - CLAUDE.md
        - .github/copilot-instructions.md
    - id: mcp-tool-calls-first
      description: "use MCP tool calls when available; fall back to the Python API on cold start or context switch"
      phrase: "MCP tool calls"
      references:
        - CLAUDE.md
        - .github/copilot-instructions.md
    - id: python-api-fallback-imports
      description: "use workstate_handoff_mcp package-root imports as the Python fallback surface"
      phrase: "from workstate_handoff_mcp import"
      references:
        - CLAUDE.md
        - .github/copilot-instructions.md

branch_isolation:
  protected_branches:
    - main
    - master
  code_roots:
    - apps/
    - packages/
    - scripts/
    - .github/hooks/
    - .claude/
    - mk/
  protected_extensions:
    - .py
    - .ts
    - .tsx
    - .js
    - .jsx
    - .php
    - .sql
    - .sh
    - .css
    - .scss
    - .mk
  root_protected_files:
    - Makefile
  # Legacy combined surface — kept populated during the WORKSTATE-REF-03 transition
  # for back-compat with `_bash_isolation_guard.py`,
  # `_guard_main_branch_inline.py`, and existing test fixtures that
  # consume `protected_main_surfaces` directly. New consumers should use
  # `first_edit_protected_surfaces` (planning artifacts) and
  # `state_dirty_surfaces` (post-merge tripwire) below; this list is
  # equivalent to `first_edit_protected_surfaces` until those consumers
  # migrate.
  protected_main_surfaces:
    - pattern: "docs/tasks/**/*.md"
      reason: "Top-level task plans must live on a task branch from the first edit"
    - pattern: "docs/assessments/**"
      reason: "Top-level assessments must live on a task branch from the first edit"
    - pattern: "docs/scopes/**"
      reason: "Top-level scope notes must live on a task branch from the first edit"
    - pattern: "docs/epics/**"
      reason: "Top-level epic planning artifacts must live on a task branch from the first edit"
    - pattern: "docs/specs/**"
      reason: "Top-level specs must live on a task branch from the first edit"
    - pattern: "docs/adrs/**"
      reason: "Top-level ADRs must live on a task branch from the first edit"
    - pattern: "packages/*/docs/tasks/**"
      reason: "Package-local task plans must live on a task branch from the first edit"
    - pattern: "packages/*/docs/assessments/**"
      reason: "Package-local assessments must live on a task branch from the first edit"
    - pattern: "packages/*/docs/specs/**"
      reason: "Package-local specs must live on a task branch from the first edit"
    - pattern: "packages/*/docs/epics/**"
      reason: "Package-local epics must live on a task branch from the first edit"
    - pattern: "packages/*/docs/adrs/**"
      reason: "Package-local ADRs must live on a task branch from the first edit"
  # WORKSTATE-REF-03: planning artefacts whose first edit must happen on a task
  # branch (PreToolUse file-mutation surface). Mirrors
  # `protected_main_surfaces` during the transition; `_worktree_drift.py`
  # and other file-mutation isolation helpers will migrate to consume
  # this key directly.
  first_edit_protected_surfaces:
    - pattern: "docs/tasks/**/*.md"
      reason: "Top-level task plans must live on a task branch from the first edit"
    - pattern: "docs/assessments/**"
      reason: "Top-level assessments must live on a task branch from the first edit"
    - pattern: "docs/scopes/**"
      reason: "Top-level scope notes must live on a task branch from the first edit"
    - pattern: "docs/epics/**"
      reason: "Top-level epic planning artifacts must live on a task branch from the first edit"
    - pattern: "docs/specs/**"
      reason: "Top-level specs must live on a task branch from the first edit"
    - pattern: "docs/adrs/**"
      reason: "Top-level ADRs must live on a task branch from the first edit"
    - pattern: "packages/*/docs/tasks/**"
      reason: "Package-local task plans must live on a task branch from the first edit"
    - pattern: "packages/*/docs/assessments/**"
      reason: "Package-local assessments must live on a task branch from the first edit"
    - pattern: "packages/*/docs/specs/**"
      reason: "Package-local specs must live on a task branch from the first edit"
    - pattern: "packages/*/docs/epics/**"
      reason: "Package-local epics must live on a task branch from the first edit"
    - pattern: "packages/*/docs/adrs/**"
      reason: "Package-local ADRs must live on a task branch from the first edit"
  # WORKSTATE-REF-03: actual runtime state files. Drives the post-merge
  # `check-main-clean` tripwire via `find_dirty_state_files()`. The
  # helper combines direct filesystem checks with `git status --ignored`
  # so tracked state surfaces still block even when Git reports a whole
  # directory; ignored-untracked generated projections remain local
  # per-checkout state and do not hard-block normal control-plane use.
  state_dirty_surfaces:
    - pattern: "CURRENT_TASK.json"
      reason: "Machine-readable active-task snapshot must not be dirty on main post-merge"
    - pattern: "DASHBOARD.txt"
      reason: "Human-readable dashboard render must not be dirty on main post-merge"
    - pattern: ".task-state/handoff.db"
      reason: "Handoff database file must not be dirty on main post-merge"
    - pattern: ".task-state/handoff.db-shm"
      reason: "Handoff database SQLite shared-memory sidecar must not be dirty on main post-merge"
    - pattern: ".task-state/handoff.db-wal"
      reason: "Handoff database SQLite WAL sidecar must not be dirty on main post-merge"
    - pattern: "docs/tasks/archive/**"
      reason: "Archived task snapshots must not be dirty on main post-merge"
    - pattern: "packages/*/docs/tasks/archive/**"
      reason: "Package-local archived task snapshots must not be dirty on main post-merge"
  # Repo-local allow-list: projects adopting this harness should rewrite these
  # patterns to match their own legitimate non-planning main-worktree surfaces.
  permitted_main_surfaces:
    - pattern: "CLAUDE.md"
      reason: "Canonical agent dispatcher stays editable on main"
    - pattern: ".github/copilot-instructions.md"
      reason: "VS Code harness mirror of CLAUDE.md"
    - pattern: "docs/workstate/BOOTSTRAP.md"
      reason: "Operator-facing cold-start reference"
    - pattern: "docs/workstate/instructions.md"
      reason: "Canonical agent instructions surface"
    - pattern: "docs/workstate/contracts/**"
      reason: "Harness contracts stay editable on main"
    - pattern: "docs/workstate/rules/**"
      reason: "Workflow rules stay editable on main"
    - pattern: "docs/workstate/maps/**"
      reason: "Routing and map artifacts stay editable on main"
    - pattern: "docs/workstate/generated/**"
      reason: "Generated agentic artifacts can update on main"
    - pattern: "docs/tasks/archive/**"
      reason: "Archived task snapshots stay editable on main"
    - pattern: "DASHBOARD.txt"
      reason: "Dashboard artifact is regenerated on main"
    - pattern: "CURRENT_TASK.json"
      reason: "Current-task snapshot is regenerated on main"
  enforcers:
    - path: .github/hooks/guard-main-branch.py
      harness: vscode
    - path: scripts/hooks/guard-main-branch.sh
      harness: claude

python_api_fallback:
  package: workstate_handoff_mcp
  required_exports:
    - RuntimeConfig
    - configure_runtime
    - get_handoff_state
    - search_handoff
    - review_findings
    - review_runs
    - record_event
    - render_handoff
    - generate_current_task_md
    - generate_dashboard_md
    - integrity_check
    - set_handoff_state
    - switch_task

compaction:
  advisory_field: compaction_recommended
  # threshold_tokens / threshold_chars are the canonical defaults and the
  # single source of truth for the compaction advisory. Sourced from
  # docs/assessments/handoff-id-auto-compaction-threshold-scope-2026-04-30.md
  # ("auto-trigger structured compaction when retained context crosses a
  # configurable threshold, initially 70,000 tokens"); the char gate uses the
  # documented `chars / 4` fallback estimator (70_000 * 4 = 280_000).
  # Per-deployment overrides (WORKSTATE-REF-63): set
  # AGENT_HANDOFF_COMPACTION_THRESHOLD_{TOKENS,CHARS} env vars, or
  # `.workstate-overlay.json -> compaction.thresholds.{tokens,chars}`.
  # Precedence per knob: env > overlay > contract.
  #
  # Runtime disable (WORKSTATE-REF-67): the unified resolver
  # `resolve_compaction_disabled(env, conn, task_ref)` silences BOTH the
  # `compute_compaction_advisory` envelope (returns
  # `disabled=true, disabled_source=<env|db>`, threshold/floor logic
  # skipped) AND the `compact-session` Stop hook (logs
  # `compaction skipped: disabled (source=<env|db>)`). Sources, in
  # precedence order: `AGENT_HANDOFF_COMPACTION_DISABLED` env var (legacy
  # `WORKSTATE_COMPACTION_DISABLED` alias) → task-scoped row in
  # `compaction_settings` → workspace-default row → enabled. DB rows are
  # written via the `compaction(operation="disable"|"enable"|"status")`
  # MCP op / `mcp-workstate-handoff compaction --operation <op>` CLI /
  # `make compaction-{disable,enable,status} [TASK=<ref>]` wrappers.
  # Host-harness compaction (Claude Code's own /compact, Codex's
  # internal summarization, etc.) is unaffected.
  threshold_tokens: 70000
  threshold_chars: 280000
  unknown_harness: warn_and_skip
  transcript_discovery:
    claude-code:
      env_var: CLAUDE_SESSION_TRANSCRIPT_PATH
      fallback_glob: ~/.claude/projects/**/transcript*.jsonl
    codex:
      env_var: CODEX_SESSION_TRANSCRIPT_PATH
      fallback_glob: ~/.codex/sessions/**/*.jsonl
    vscode:
      env_var: VSCODE_TARGET_SESSION_LOG
      fallback_glob: ~/Library/Application Support/Code/User/workspaceStorage/**/GitHub.copilot-chat/**/*.json

orchestrator:
  daemons:
    enabled: false

terminal_guard:
  policy_version: terminal-guard-v1
  command_preview_limit: 256
  telemetry_write_budget_seconds: 1.5
  fallback_spool_path: .task-state/terminal_guard.jsonl

hooks:
  pre_tool_use:
    - id: worktree-drift
      matcher: Edit|Write|apply_patch|create_file|replace_string_in_file|multi_replace_string_in_file
      claude_command: bash "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-worktree-drift.sh"
      vscode_command: python3 .github/hooks/guard-worktree-drift.py
    - id: bash-main-branch
      matcher: Bash
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-bash-main-branch.py"
      vscode_command: python3 scripts/hooks/guard-bash-main-branch.py
    # Matcher is intentionally narrowed to `Bash` only — broadening to
    # `Bash|run_in_terminal` is gated on WORKSTATE-REF-53 implementation note (Edit/Write
    # dirty-main hot-path moves to publish/close). Adding `run_in_terminal`
    # earlier layers a second mediator on top of the existing Edit/Write
    # friction and increases consumer-agent friction (see
    # docs/assessments/consumer-agent-main-worktree-hook-friction-assessment-2026-05-15.md
    # "WORKSTATE-REF-59 Trajectory Correction"). The hook code accepts `run_in_terminal`
    # payloads so the future broadening is a one-line matcher change.
    - id: terminal-guard
      matcher: Bash
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/terminal-guard.py"
      vscode_command: python3 scripts/hooks/terminal-guard.py
    - id: task-plan-findings
      matcher: Edit|Write
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-task-plan-findings.py"
      vscode_command: python3 scripts/hooks/guard-task-plan-findings.py
    - id: rationale-size
      matcher: mcp_altcontext-mc_record_event|mcp_altcontext-mc_close_slice|mcp__workstate-handoff-mcp__record_event|mcp__workstate-handoff-mcp__close_slice
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/guard-rationale-size.py"
      vscode_command: python3 scripts/hooks/guard-rationale-size.py
    - id: validate-mcp-dict-params
      matcher: mcp_altcontext-mc_record_event|mcp_altcontext-mc_review_findings|mcp_altcontext-mc_review_runs|mcp__workstate-handoff-mcp__record_event|mcp__workstate-handoff-mcp__review_findings|mcp__workstate-handoff-mcp__review_runs
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/validate-mcp-dict-params.py"
      vscode_command: python3 scripts/hooks/validate-mcp-dict-params.py
  post_tool_use:
    - id: record-file-touch
      matcher: Edit|Write
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/record-file-touch.py"
      vscode_command: python3 scripts/hooks/record-file-touch.py
    - id: ace-detect
      matcher: mcp_altcontext-mc_review_findings|mcp__workstate-handoff-mcp__review_findings
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/ace-detect.py"
      vscode_command: python3 scripts/hooks/ace-detect.py
    - id: slim-handoff-response
      matcher: mcp_altcontext-mc_get_handoff_state|mcp_altcontext-mc_load_session|mcp_altcontext-mc_render_handoff|mcp__workstate-handoff-mcp__get_handoff_state|mcp__workstate-handoff-mcp__load_session|mcp__workstate-handoff-mcp__render_handoff
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/slim-handoff-response.py"
      vscode_command: python3 scripts/hooks/slim-handoff-response.py
  # SessionStart and UserPromptSubmit hooks have no tool-name matcher in the
  # Claude Code schema; the matcher field is omitted intentionally.
  session_start:
    - id: advise-worktree-cd
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/advise-worktree-cd.py"
      vscode_command: python3 scripts/hooks/advise-worktree-cd.py
  user_prompt_submit:
    - id: advise-worktree-cd
      claude_command: python3 "$CLAUDE_PROJECT_DIR/scripts/hooks/advise-worktree-cd.py"
      vscode_command: python3 scripts/hooks/advise-worktree-cd.py
